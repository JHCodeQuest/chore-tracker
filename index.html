<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chore Tracker</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #252540;
    --accent: #6c63ff;
    --accent-glow: rgba(108, 99, 255, 0.3);
    --text: #e8e8f0;
    --text2: #9898b0;
    --green: #2ecc71;
    --green-bg: rgba(46, 204, 113, 0.15);
    --red: #e74c3c;
    --red-bg: rgba(231, 76, 60, 0.15);
    --radius: 16px;
    --radius-sm: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { padding: 16px 16px 100px; }

  .header {
    text-align: center;
    padding: 24px 0 20px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    color: var(--text2);
    font-size: 14px;
    margin-top: 4px;
  }

  .stats-row {
    display: flex;
    gap: 10px;
    margin: 16px 0;
  }
  .stat-card {
    flex: 1;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 700;
  }
  .stat-card .label {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .stat-card.completed .num { color: var(--green); }
  .stat-card.streak .num { color: var(--accent); }

  .add-form {
    display: flex;
    gap: 8px;
    margin: 16px 0;
  }
  .add-form input {
    flex: 1;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border 0.2s;
  }
  .add-form input:focus {
    border-color: var(--accent);
  }
  .add-form input::placeholder { color: var(--text2); }
  .add-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    width: 50px;
    font-size: 24px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .add-form button:active { transform: scale(0.95); }

  .chore-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chore-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.04);
    transition: all 0.3s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chore-card.done {
    border-color: var(--green);
    background: var(--green-bg);
  }

  .chore-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chore-name {
    flex: 1;
    font-size: 16px;
    font-weight: 500;
  }
  .chore-card.done .chore-name {
    text-decoration: line-through;
    opacity: 0.6;
  }

  .check-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--text2);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    color: transparent;
    font-size: 16px;
  }
  .check-btn:active { transform: scale(0.9); }
  .check-btn.checked {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .delete-btn:active { color: var(--red); }

  .chore-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .streak-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
  }
  .streak-badge .fire {
    font-size: 15px;
  }
  .week-grid {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .day-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--surface2);
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .day-dot.done { background: var(--green); }
  .day-dot.today { border: 2px solid var(--accent); }
  .day-dot.missed { background: var(--red); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 20px 0 10px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5fa;
      --surface: #ffffff;
      --surface2: #e8e8f0;
      --text: #1a1a2e;
      --text2: #8888a0;
      --accent-glow: rgba(108, 99, 255, 0.15);
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Chore Tracker</h1>
  <p id="dateDisplay"></p>
</div>

<div class="stats-row">
  <div class="stat-card completed">
    <div class="num" id="todayCount">0/0</div>
    <div class="label">Today</div>
  </div>
  <div class="stat-card streak">
    <div class="num" id="totalStreak">0</div>
    <div class="label">Best Streak</div>
  </div>
  <div class="stat-card">
    <div class="num" id="totalCompleted">0</div>
    <div class="label">Total Done</div>
  </div>
</div>

<div class="add-form">
  <input type="text" id="choreInput" placeholder="Add a chore..." autocomplete="off">
  <button id="addBtn">+</button>
</div>

<div class="section-title">Today's Chores</div>
<div class="chore-list" id="choreList"></div>

<script>
  const STORAGE_KEY = 'chore_tracker_data';
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return { chores: [] };
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
  }

  function getLast7Days() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    return days;
  }

  function computeStreak(history) {
    let streak = 0;
    const d = new Date();
    while (true) {
      const key = d.toISOString().slice(0, 10);
      if (history[key]) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function computeBestStreak(history) {
    const sorted = Object.keys(history).filter(k => history[k]).sort();
    if (!sorted.length) return 0;
    let best = 1, cur = 1;
    for (let i = 1; i < sorted.length; i++) {
      const prev = new Date(sorted[i-1] + 'T12:00:00');
      const curr = new Date(sorted[i] + 'T12:00:00');
      const diff = (curr - prev) / (1000 * 60 * 60 * 24);
      if (diff === 1) {
        cur++;
        best = Math.max(best, cur);
      } else {
        cur = 1;
      }
    }
    return Math.max(best, cur);
  }

  function toggleChore(id) {
    const chore = state.chores.find(c => c.id === id);
    if (!chore) return;
    const t = today();
    if (chore.history[t]) {
      delete chore.history[t];
    } else {
      chore.history[t] = true;
    }
    saveState();
    render();
  }

  function deleteChore(id) {
    state.chores = state.chores.filter(c => c.id !== id);
    saveState();
    render();
  }

  function addChore(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    const chore = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: trimmed,
      createdAt: today(),
      history: {}
    };
    state.chores.push(chore);
    saveState();
    render();
  }

  let isSubmitting = false;

  function render() {
    const t = today();
    const list = document.getElementById('choreList');
    const todayCount = document.getElementById('todayCount');
    const totalStreak = document.getElementById('totalStreak');
    const totalCompleted = document.getElementById('totalCompleted');

    const last7 = getLast7Days();

    let doneToday = 0;
    let allTimeDone = 0;
    let bestStreakOverall = 0;
    state.chores.forEach(c => {
      if (c.history[t]) doneToday++;
      allTimeDone += Object.values(c.history).filter(Boolean).length;
      bestStreakOverall = Math.max(bestStreakOverall, computeBestStreak(c.history));
    });

    todayCount.textContent = doneToday + '/' + state.chores.length;
    totalStreak.textContent = bestStreakOverall;
    totalCompleted.textContent = allTimeDone;

    if (state.chores.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">🧹</div>
          <p>No chores yet. Add one above!<br>Try "Take out trash" or "Do dishes"</p>
        </div>`;
      return;
    }

    list.innerHTML = state.chores.map(chore => {
      const done = !!chore.history[t];
      const streak = computeStreak(chore.history);
      const weekStatus = last7.map(d => {
        if (chore.history[d]) return 'done';
        if (d === t) return 'today';
        return '';
      });

      return `
        <div class="chore-card ${done ? 'done' : ''}">
          <div class="chore-top">
            <button class="check-btn ${done ? 'checked' : ''}" data-id="${chore.id}">✓</button>
            <span class="chore-name">${escapeHtml(chore.name)}</span>
            <button class="delete-btn" data-id="${chore.id}">✕</button>
          </div>
          <div class="chore-meta">
            <div class="streak-badge">
              <span class="fire">${streak >= 3 ? '🔥' : '⚡'}</span>
              ${streak} day${streak !== 1 ? 's' : ''}
            </div>
            <div class="week-grid">
              ${weekStatus.map(s => `<div class="day-dot ${s}"></div>`).join('')}
            </div>
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.check-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleChore(btn.dataset.id));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteChore(btn.dataset.id));
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    const input = document.getElementById('choreInput');
    addChore(input.value);
    input.value = '';
    input.focus();
  });
  document.getElementById('choreInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      document.getElementById('addBtn').click();
    }
  });

  render();
</script>
</body>
</html>
